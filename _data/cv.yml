projects:
  title: Projects
  items:
    - title: Tennon
      link: https://github.com/yurifrl/tennon
      content: Kubernetes-native control plane and proxy for MCP servers, in Go (~8.5k lines, Helm chart, React UI). Injects credentials server-side so agents never see secrets, enforces allow/ask/block policies with human-in-the-loop approvals, supports OIDC and workload identity, and turns OpenAPI and GraphQL specs into MCP tools. Pluggable storage (SQLite, Postgres, Kubernetes CRDs) and runtimes (remote, Docker, Kubernetes).
    - title: Agent Substrate on a home Kubernetes cluster
      link: https://github.com/yurifrl/home-systems
      content: Runs agent-substrate, gVisor-sandboxed AI agents on Kubernetes, on a 7-node Talos Linux cluster managed with GitOps (61 ArgoCD applications). Ported the Helm charts to Talos, fixed RBAC that blocked worker scheduling, enabled user namespaces for gVisor, made the charts multi-arch (amd64/arm64), and built a CI pipeline that publishes digest-pinned images.

