title: Staff Site Reliability Engineer
location: Brazil
content: "Staff SRE building the platform layer under production systems: AI agent infrastructure on Kubernetes, load-testing and capacity engineering, and incident response. At Flutter Brazil, cut cluster cost 37% while absorbing a 9.7x World Cup traffic peak, and built the company's internal AI agent platform. 15 years across Kubernetes, GitOps, Go, Elixir and cloud infrastructure."

main_items:
  - title: AI Platform Engineering
    content: Built and run an internal AI agent platform on Kubernetes (Google ADK, MCP, A2A) with an LLM gateway for per-project cost tracking, PII and prompt-injection guardrails and spend limits across OpenAI, Anthropic, AWS Bedrock and OpenRouter, plus per-user OAuth access to the company data lake. Open-source author of Tennon, a Kubernetes-native control plane for MCP servers.

