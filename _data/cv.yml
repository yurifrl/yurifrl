projects:
  title: Projects
  items:
    - title: Tennon
      link: https://github.com/yurifrl/tennon
      contents:
        - "Open-source, Kubernetes-native control plane and proxy for MCP servers (Go, Helm, React)."
        - "Injects credentials server-side so agents never see secrets, enforces allow/ask/block policies with human-in-the-loop approvals, supports OIDC and workload identity, and turns OpenAPI and GraphQL specs into MCP tools."
        - "Pluggable storage (SQLite, Postgres, Kubernetes CRDs) and runtimes (remote, Docker, Kubernetes)."
        - "Part of a wider agents platform with an AgentTask custom resource and controller (Go) that runs coding agents as isolated Kubernetes pods and returns PRs."
    - title: nostos
      link: https://github.com/yurifrl/nostos
      contents:
        - "Open-source Go CLI (Charm TUI) that owns the bare-metal-to-cluster flow for Talos Linux home labs."
        - "Renders machine configs from 1Password references and mints a fresh Tailscale auth key on every render, so no secrets live in git."
        - "Builds multi-arch images, PXE-boots nodes, produces flashable images for zero-touch remote sites, installs Talos or Proxmox through a pluggable OS-image layer, builds signed guest-VM ISOs, and bootstraps Cilium, ArgoCD and External Secrets on a fresh cluster."
    - title: Home Kubernetes platform (home-systems)
      link: https://github.com/yurifrl/home-systems
      contents:
        - "GitOps repo for a 7-node Talos Linux cluster plus an offsite Raspberry Pi that joins over Tailscale."
        - "Everything is declarative: 63 ArgoCD applications behind Istio ambient mesh, SLOs as code with Pyrra, and Crossplane for Proxmox VMs and GCP resources."
        - "Secrets come from 1Password through External Secrets, so none live in git."

previous:
  title: Professional Experience
  items:
    - title: Staff Site Reliability Engineer - Flutter Brazil
      period: 02/2024 to Present
      context: "Brazilian business of Flutter Entertainment, the world's largest online sports entertainment company, with about 1.5M monthly active users and peaks of about 200,000 concurrent users during the 2026 World Cup."
      contents:
        - "Tech lead of the SRE team, setting technical direction for the platform, reliability and AI work below."
        - "Built AI Hub, the internal AI agent platform: dozens of agents and MCP servers run as Kubernetes pods declared in YAML, built on Google ADK and delegating to each other over A2A; teams query the data lake from Slack in natural language under per-user OAuth."
        - "Started the AI Hub Gateway, which now routes every LLM call in the company across OpenAI, Anthropic, AWS Bedrock and OpenRouter, with per-project cost tracking, PII and prompt-injection guardrails, and daily spend limits."
        - "Led right-sizing of the production Kubernetes cluster ahead of the 2026 World Cup, setting CPU and memory from real usage with an AI right-sizing agent: 62% fewer nodes, 37% lower monthly cost and a 9.7x traffic peak absorbed."
        - "Wrote the Athena-backed cost APIs (Python, FastAPI, boto3) for the FinOps Hub, fixing attribution that had left about 72% of a month's AWS spend unattributed."
        - "Designed and ran World Cup hypercare across 90+ matches, leading the Watch Tower portal and the main war rooms: roles, runbooks, dashboards, escalation paths, and Showtime, a live stream of matches with real-time metrics overlaid. Held the platform through a record 200,000 concurrent users (116 EKS nodes) in Brazil vs Haiti."
        - "Created and led the load-testing platform (41 services, 1,500+ published run reports), triggered from GitHub Actions, PR comments, a CLI or AI agents, staging-only by default with SRE review for production. It exposed real breaking points and misattributed bottlenecks before peak traffic hit and is now a standard part of the developer workflow."
        - "Set up the SLO and incident-response practice: led incident response and blameless postmortems through the tournament (61 incidents in incident.io, 29 inside match war rooms), hosted a weekly incident-learning session, and built Incident Review Admin for automated review slides, action-item follow-up and AI-assisted investigation."
        - "Rolled out an AI on-call agent that reacts to Grafana OnCall alerts (~900 a month), troubleshoots them on its own through tool-calling over kubectl, Prometheus metrics, logs and runbooks, and hands on-call developers a root-cause analysis to start from."
        - "Created two agent-driven testing systems: Guru (LangGraph, FastAPI, Redis, Postgres), whose 10 specialist agents read service SLIs and open draft PRs with stronger k6 load tests (22 PRs in its first week); and e2ai (Go, TypeScript, Playwright), whose agents run end-to-end test plans on web and mobile apps and post verdicts with evidence on PRs."
        - Cut the delivery pipeline from about 30 minutes to 5–10 minutes through Docker build and pipeline optimization, so teams deploy more often.
        - "Moved day-to-day AI usage from Claude to GLM 5.3 through AI Hub; GLM now serves ~78% of gateway traffic at about a tenth of the per-token cost, with frontier models kept for the work that needs them."
        - "Built Babel Fish, a production Slack translation bot (Go, AWS Bedrock) that lets Brazilian and international teams work in their own languages by reacting with a flag, with cross-region model fallback, PII redaction and promptfoo evals."
        - Introduced Crossplane so developers declare their application's infrastructure next to the app itself; adopted by 200+ services, removing hand-off tickets between teams.
        - "Turned the annual regulatory certification, which took dozens of people the year before, into an AI-driven process that runs almost entirely on its own."
        - Ran a monthly platform forum with developers to collect pain points; whole platform features, such as multi-branch deploys in our development platform, came directly from it.
    - title: Senior Site Reliability Engineer - CloudWalk
      period: 11/2022 to 02/2024
      context: "Brazilian fintech behind InfinitePay, a payments platform for small merchants."
      contents:
        - "Owned deployment and operation of CloudWalk's blockchain ledger on Kubernetes in Google Cloud: a permissioned, Ethereum-compatible network settling InfinitePay receivables in the BRLC stablecoin. Ran it through peak growth after the migration to a network built for 500 transactions per second, 70x the previous capacity."
        - Built CI/CD pipelines across multi-cluster Kubernetes, with all infrastructure as code in Terraform, Helm and ArgoCD.
        - Designed the observability stack (Prometheus, Quickwit, OpenTelemetry) for logging, monitoring and alerting, plus system status metrics that let development teams see how their own services perform.
    - title: Senior Software Engineer - Telnyx
      period: 12/2020 to 11/2022
      context: "Global cloud communications platform offering voice, messaging and IoT APIs over its own network."
      contents:
        - Built and ran production number-portability services in Elixir and Phoenix, designing new features through RFCs.
        - Worked on SLOs, observability and deployment speed while paying down technical debt.
    - title: Senior Site Reliability Engineer - Dafiti
      period: 07/2019 to 12/2020
      context: "One of Latin America's largest online fashion retailers."
      contents:
        - Modernized the legacy architecture of Dafiti's e-commerce platform (4M+ active customers) into cloud-based microservices on Kubernetes on AWS, deployed with ArgoCD and connected through an Istio service mesh.
        - "Prepared the platform for Black Friday: application sizing, automated load and acceptance testing, and SLO work. Refactored critical workflows such as checkout to be more test-friendly, so tests could run as close to production behavior as possible."
    - title: Senior Software Engineer - TOTVS
      period: 04/2017 to 07/2019
      context: "Brazil's largest enterprise software (ERP) company."
      contents:
        - Moved the company's flagship application from per-customer on-premises installs to containers on Kubernetes, turning it into a scalable SaaS product.
        - Built a platform that let users provision any type of service through a GraphQL API, later evolved into a set of Kubernetes controllers that provisioned systems from Kubernetes CRDs, before Crossplane existed.
    - title: Full Stack Software Engineer - Yebo
      period: 2011 to 02/2017
      contents:
        - "Built and ran a large-scale e-commerce backend platform: customers plugged in their own frontends while the platform handled all the business rules and features an online store needs."
        - Before Yebo, built e-commerce and institutional websites as a freelancer.
